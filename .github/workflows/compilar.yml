# Compilación del fangame Arcane para Windows.
name: Compilar Arcane (solo Windows)
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      retencion:
        description: "Días que se guardan los artefactos para descargarlos (1-90)"
        type: number
        default: 14
permissions:
  contents: write
concurrency:
  group: compilar-${{ github.ref }}
  # La compilación manual solo genera artefactos; las Releases se crean fuera de este workflow.
  cancel-in-progress: ${{ github.event_name != 'workflow_dispatch' }}
env:
  PROYECTO: arcane-fangame
  RETENCION: ${{ inputs.retencion || 14 }}
jobs:
  comprobaciones:
    name: Comprobaciones del proyecto
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.ver.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Instalar dependencias (sin descargar Electron)
        run: npm ci --ignore-scripts
      - id: ver
        name: Leer la versión de package.json
        run: |
          v=$(node -p "require('./package.json').version")
          if ! [[ "$v" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::La versión «$v» de package.json no tiene el formato X.Y.Z"
            exit 1
          fi
          echo "version=$v" >> "$GITHUB_OUTPUT"
          echo "Versión: $v"
      - name: Comprobar datos del juego
        run: npm run check
      - name: Verificar sintaxis de todos los scripts del repositorio
        run: |
          fallos=0
          while IFS= read -r f; do
            node --check "$f" || { echo "::error file=$f::Error de sintaxis"; fallos=1; }
          done < <(git ls-files '*.js')
          exit "$fallos"

  windows:
    name: Windows (x64)
    needs: comprobaciones
    runs-on: windows-latest
    env:
      VERSION: ${{ needs.comprobaciones.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Instalar dependencias
        run: npm ci
      - name: Compilar instalador y portable de Windows
        run: npm run dist:win -- --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
      - name: Comprobar que existen ambos ejecutables
        shell: pwsh
        run: |
          $files = @(Get-ChildItem dist -Filter '*.exe')
          if ($files.Count -lt 2) { throw 'No se han generado ambos ejecutables de Windows' }
          $files | ForEach-Object { Write-Host $_.Name $_.Length }
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.PROYECTO }}-${{ env.VERSION }}-windows-x64
          path: dist/*.exe
          if-no-files-found: error
          retention-days: ${{ env.RETENCION }}

  blender-mapas:
    name: Modelar y exportar mapas con Blender
    if: ${{ github.event_name == 'pull_request' && github.head_ref == '3d/mapa-modelos-escala-residentes' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - id: maps
        name: Comprobar si faltan los escenarios 3D
        shell: bash
        run: |
          if [[ -s src/models/maps/piltover.glb && -s src/models/maps/zaun.glb ]]; then
            echo "generate=false" >> "$GITHUB_OUTPUT"
            echo "Los dos GLB ya están en la rama; no se regeneran en cada actualización."
          else
            echo "generate=true" >> "$GITHUB_OUTPUT"
            echo "Faltan escenarios: se ejecutará el modelado y exportador de Blender."
          fi
      - name: Instalar Blender
        if: steps.maps.outputs.generate == 'true'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y blender python3-numpy libegl1 libegl-mesa0 libgl1-mesa-dri libgbm1 libxkbcommon0 libxrender1 libxext6 libxi6 libxfixes3
          blender --version
      - name: Modelar ciudades, exportar GLB y renderizar pruebas de cámara
        if: steps.maps.outputs.generate == 'true'
        run: |
          python3 -m py_compile tools/blender/build_arcane_maps.py
          EGL_PLATFORM=surfaceless LIBGL_ALWAYS_SOFTWARE=1 PYTHONPATH="/usr/lib/python3/dist-packages:${PYTHONPATH:-}" blender --background --factory-startup --python tools/blender/build_arcane_maps.py
          test -s src/models/maps/piltover.glb
          test -s src/models/maps/zaun.glb
          test -s src/models/maps/piltover.blend
          test -s src/models/maps/zaun.blend
          for city in piltover zaun; do
            test -s "docs/mapa-3d-preview/${city}-overview.png"
            test -s "docs/mapa-3d-preview/${city}-street-scale.png"
            test -s "docs/mapa-3d-preview/${city}-zoom-close.png"
          done
      - name: Guardar GLB, escenas editables y renders para revisión
        uses: actions/upload-artifact@v4
        with:
          name: mapas-blender-piltover-zaun
          path: |
            src/models/maps/piltover.glb
            src/models/maps/zaun.glb
            src/models/maps/piltover.blend
            src/models/maps/zaun.blend
            docs/mapa-3d-preview/*.png
          if-no-files-found: error
          retention-days: ${{ env.RETENCION }}
      - name: Incorporar activos Blender al PR
        if: steps.maps.outputs.generate == 'true'
        env:
          BRANCH: ${{ github.head_ref }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/models/maps/piltover.glb src/models/maps/zaun.glb
          git add src/models/maps/piltover.blend src/models/maps/zaun.blend
          git add docs/mapa-3d-preview/*.png
          if git diff --cached --quiet; then
            echo "No hay nuevos activos para incorporar."
            exit 0
          fi
          git commit -m "Añadir escenarios de Piltover y Zaun modelados en Blender"
          git push origin "HEAD:${BRANCH}"
