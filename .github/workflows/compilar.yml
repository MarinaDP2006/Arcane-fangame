# Compilación del fangame Arcane para Windows.
name: Compilar Arcane (solo Windows)
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      retencion:
        description: "Días que se guardan los artefactos para descargarlos (1-90)"
        type: number
        default: 14
permissions:
  contents: write
concurrency:
  group: compilar-${{ github.ref }}
  # La compilación manual solo genera artefactos; las Releases se crean fuera de este workflow.
  cancel-in-progress: ${{ github.event_name != 'workflow_dispatch' }}
env:
  PROYECTO: arcane-fangame
  RETENCION: ${{ inputs.retencion || 14 }}
jobs:
  comprobaciones:
    name: Comprobaciones del proyecto
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.ver.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Instalar dependencias (sin descargar Electron)
        run: npm ci --ignore-scripts
      - id: ver
        name: Leer la versión de package.json
        run: |
          v=$(node -p "require('./package.json').version")
          if ! [[ "$v" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::La versión «$v» de package.json no tiene el formato X.Y.Z"
            exit 1
          fi
          echo "version=$v" >> "$GITHUB_OUTPUT"
          echo "Versión: $v"
      - name: Sincronizar arte canónico y manifiesto
        run: node scripts/art-manifest.js
      - name: Comprobar datos del juego
        run: npm run check
      - name: Construir y validar la web pública para Render
        run: npm run check:web
      - name: Verificar sintaxis de todos los scripts del repositorio
        run: |
          fallos=0
          while IFS= read -r f; do
            node --check "$f" || { echo "::error file=$f::Error de sintaxis"; fallos=1; }
          done < <(git ls-files '*.js')
          exit "$fallos"

  windows:
    name: Windows (x64)
    needs: comprobaciones
    runs-on: windows-latest
    env:
      VERSION: ${{ needs.comprobaciones.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Instalar dependencias
        run: npm ci
      - name: Sincronizar arte canónico y manifiesto
        run: node scripts/art-manifest.js
      - name: Generar icono PNG de Windows desde el icono oficial de la web
        shell: pwsh
        run: |
          npm install --no-save --package-lock=false @resvg/resvg-js png-to-ico
          node -e "const fs=require('fs'); const {Resvg}=require('@resvg/resvg-js'); const pngToIcoModule=require('png-to-ico'); const pngToIco=pngToIcoModule.default || pngToIcoModule; const svg=fs.readFileSync('web/icono-arcane.svg'); const png=new Resvg(svg,{fitTo:{mode:'width',value:256}}).render().asPng(); fs.mkdirSync('build',{recursive:true}); fs.writeFileSync('build/icon.png',png); pngToIco(png).then(ico=>fs.writeFileSync('build/icon.ico',ico)).catch(e=>{console.error(e);process.exit(1)});"
          if (!(Test-Path build/icon.png) -or (Get-Item build/icon.png).Length -lt 1000 -or !(Test-Path build/icon.ico) -or (Get-Item build/icon.ico).Length -lt 1000) { throw 'No se pudieron generar los iconos PNG e ICO de Windows' }
      - name: Compilar instalador y portable de Windows
        run: npm run dist:win -- --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
      - name: Comprobar que existen ambos ejecutables
        shell: pwsh
        run: |
          $files = @(Get-ChildItem dist -Filter '*.exe')
          if ($files.Count -lt 2) { throw 'No se han generado ambos ejecutables de Windows' }
          $files | ForEach-Object { Write-Host $_.Name $_.Length }
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.PROYECTO }}-${{ env.VERSION }}-windows-x64
          path: dist/*.exe
          if-no-files-found: error
          retention-days: ${{ env.RETENCION }}
